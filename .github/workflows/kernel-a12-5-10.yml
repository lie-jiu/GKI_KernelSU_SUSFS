name: 内核构建 - Android 12 (5.10)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      target_versions:
        description: "要编译的 5.10 子版本（all 或留空=全部；支持 236 / 5.10.236 / 5.10.236,5.10.240）"
        required: false
        type: string
        default: "all"
      kernelsu_variant:
        description: "KernelSU 变体"
        required: true
        type: choice
        options:
          - Official
          #- Next
          - SukiSU
          - SukiSU(40726)
          - SukiSU(40548)
          - ReSukiSU
        default: ReSukiSU
      version:
        description: "自定义版本名 (可选)"
        required: false
        type: string
      build_time:
        description: "自定义构建时间 (可选，N或留空=当前UTC)"
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"
      use_kpm:
        description: "KPM 功能（patched 尚不支持）"
        required: true
        type: choice
        default: "disabled (关闭)"
        options:
          - "disabled (关闭)"
          - "enabled (开启)"
          - "patched (开启并修补，尚不支持)"
      droidspaces:
        description: "Droidspaces 容器支持"
        required: false
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "off"
      artifact_upload_mode:
        description: "构建产物上传模式"
        required: true
        type: choice
        options:
          - "仅上传 AnyKernel3.zip"
          - "上传全部"
        default: "仅上传 AnyKernel3.zip"
      droidspaces_ntsync:
        description: "启用 Droidspaces 容器 NTSync 支持（需启用 Droidspaces）"
        required: false
        type: boolean
        default: false
      use_zram:
        description: "启用 ZRAM 增强算法"
        required: true
        type: boolean
        default: false
      use_bbg:
        description: "启用 BBG 防格机"
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: "启用 Re-Kernel 驱动"
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "应用 CVE-2026-43499 rtmutex 修复链"
        required: false
        type: boolean
        default: false
      cancel_susfs:
        description: "禁用 SUSFS"
        required: true
        type: boolean
        default: false
  workflow_call:
    inputs:
      target_versions:
        description: "要编译的 5.10 子版本（all 或留空=全部；支持 236 / 5.10.236 / 5.10.236,5.10.240）"
        required: false
        type: string
        default: "all"
      kernelsu_variant:
        required: true
        type: string
      version:
        required: false
        type: string
      build_time:
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"
      use_zram:
        required: true
        type: boolean
      use_bbg:
        required: true
        type: boolean
      use_kpm:
        required: true
        type: string
      use_rekernel:
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        required: false
        type: boolean
        default: false
      cancel_susfs:
        required: false
        type: boolean
      droidspaces:
        required: false
        type: string
        default: "off"
      artifact_upload_mode:
        required: false
        type: string
        default: "上传全部"
      droidspaces_ntsync:
        required: false
        type: boolean
        default: false
      called_from_main:
        description: "是否从 main.yml 调用（内部使用）"
        required: false
        type: boolean
        default: false

jobs:
  # 根据 target_versions 输入筛选出真正需要构建的版本，避免编译全部 22 个子版本
  setup-matrix:
    name: 解析构建目标
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      summary: ${{ steps.gen.outputs.summary }}
    steps:
      - name: 生成 5.10 构建矩阵
        id: gen
        env:
          TARGETS: ${{ inputs.target_versions || 'all' }}
        run: |
          set -euo pipefail

          # 5.10 全部可用版本（此处为唯一数据源）
          # 格式: sub_level|os_patch_level|revision
          VERSIONS=(
            "66|2022-01|r11"
            "81|2022-03|r11"
            "101|2022-04|r28"
            "110|2022-07|r1"
            "117|2022-09|r1"
            "136|2022-11|r15"
            "149|2023-01|r1"
            "160|2023-03|r1"
            "168|2023-04|r9"
            "177|2023-07|r3"
            "185|2023-09|r1"
            "198|2024-01|r17"
            "205|2024-03|r1"
            "209|2024-05|r13"
            "218|2024-08|r14"
            "226|2024-11|r8"
            "233|2025-02|r1"
            "236|2025-05|r1"
            "237|2025-06|r1"
            "240|2025-09|r1"
            "246|2025-12|r1"
            "X|lts|r1"
          )

          raw="$(printf '%s' "${TARGETS:-all}" | tr -d '[:space:]')"
          [ -z "$raw" ] && raw="all"

          is_all=0
          wanted=()
          case "$raw" in
            all|ALL|All|'*')
              is_all=1
              ;;
            *)
              IFS=',' read -r -a parts <<< "$raw"
              for p in "${parts[@]}"; do
                [ -z "$p" ] && continue
                p="${p#android12-5.10.}"
                p="${p#5.10.}"
                p="${p#5.10-}"
                p="${p#v}"
                wanted+=("$p")
              done
              ;;
          esac

          include="[]"
          labels=""
          for v in "${VERSIONS[@]}"; do
            IFS='|' read -r sub patch rev <<< "$v"
            hit=0
            if [ "$is_all" -eq 1 ]; then
              hit=1
            else
              for w in ${wanted[@]+"${wanted[@]}"}; do
                if [ "$w" = "$sub" ]; then
                  hit=1
                  break
                fi
              done
            fi
            if [ "$hit" -eq 1 ]; then
              include="$(jq -c -n --argjson a "$include" --arg s "$sub" --arg p "$patch" --arg r "$rev" \
                '$a + [{"sub_level": $s, "os_patch_level": $p, "revision": $r}]')"
              labels="${labels:+$labels, }5.10.${sub}-${patch}"
            fi
          done

          if [ "$include" = "[]" ]; then
            avail="$(printf '%s\n' "${VERSIONS[@]}" | cut -d'|' -f1 | paste -sd, -)"
            echo "::error::未匹配到任何 5.10 内核版本（输入: ${raw}）。可选值: all 或 ${avail}"
            exit 1
          fi

          matrix="$(jq -c -n --argjson i "$include" '{include: $i}')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "summary=$labels" >> "$GITHUB_OUTPUT"
          {
            echo "### 5.10 构建目标"
            echo ""
            echo "- 输入: \`${raw}\`"
            echo "- 将构建: ${labels}"
          } >> "$GITHUB_STEP_SUMMARY"

  build-kernels-a12-5-10:
    needs: setup-matrix
    name: "5.10.${{ matrix.sub_level }}-${{ matrix.os_patch_level }}"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android12"
      kernel_version: "5.10"
      sub_level: ${{ matrix.sub_level }}
      os_patch_level: ${{ matrix.os_patch_level }}
      revision: ${{ matrix.revision }}
      ksu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      supp_op: false
      enable_susfs: ${{ !inputs.cancel_susfs }}
      droidspaces: ${{ inputs.droidspaces || 'off' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}

  # 仅在直接触发时运行，从 main.yml 调用时跳过
  get-ksu-manager:
    if: ${{ !inputs.called_from_main }}
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
